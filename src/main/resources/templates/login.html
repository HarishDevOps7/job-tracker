```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Job Tracker</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101c3a, #263f70);
        }

        .login-card {
            width: 380px;
            padding: 38px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        h1 { text-align: center; margin-bottom: 8px; color: #172b4d; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 30px; }

        label { display: block; margin: 16px 0 7px; font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .message { text-align: center; margin-top: 15px; color: #dc2626; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>Job Tracker</h1>
    <p class="subtitle">Sign in to manage your career</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Email Address</label>
        <input type="email" id="username" name="username"
               placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit">Sign In</button>
    </form>

    <p class="message" th:if="${param.error}">
        Invalid email or password.
    </p>

    <p class="message" th:if="${param.logout}">
        You have logged out successfully.
    </p>
</div>
</body>
</html>
```
