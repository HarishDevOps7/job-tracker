# UAT Database (Fed from UAT environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Protect UAT Database Schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# UAT Admin Account (No hardcoded credentials)
app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# SMS Mode (Defaults to MOCK if SMS_MODE is not passed on server)
app.sms.mode=${SMS_MODE:MOCK}

# UAT Production-Ready Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.authentication=INFO
logging.level.org.springframework.web=INFO
logging.level.com.harish.job_tracker=INFO