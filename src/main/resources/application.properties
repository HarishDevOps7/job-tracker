
spring.application.name=job-tracker

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_tracker}
spring.datasource.username=${DB_USERNAME:jobapp}
spring.datasource.password=${DB_PASSWORD:JobApp@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8081

# Admin Account
app.admin.name=${ADMIN_NAME:Harish}
app.admin.email=${ADMIN_EMAIL:naiduharish146@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Hcn678910@}

# Security Logging
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.authentication=TRACE


# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMS Configuration
app.sms.mode=MOCK

# MSG91 Configuration
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.template-id=${MSG91_TEMPLATE_ID:}
msg91.base-url=https://control.msg91.com/api/v5/otp



# Google OAuth2 Configuration

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub


logging.level.org.springframework.web=DEBUG
logging.level.com.harish.job_tracker=DEBUG
server.error.include-message=always